packages:
  - extension
  - vendor/t3code/packages/*

allowBuilds:
  # The headless load's Chromium (pnpm test:web), into Playwright's per-user cache.
  "@playwright/browser-chromium": true
  # Marketplace signing; a local VSIX is not signed.
  "@vscode/vsce-sign": false
  esbuild: true

# T3 Code Extensible's catalog at the pin, written by scripts/vendor.ts.
catalog:
  "@clerk/backend": 3.18.1
  "@clerk/clerk-js": 6.32.1
  "@clerk/electron": 0.0.44
  "@clerk/electron-passkeys": 0.0.3
  "@clerk/expo": 4.6.8
  "@clerk/react": 6.16.1
  "@clerk/shared": 4.33.0
  "@effect/atom-react": 4.0.1
  "@effect/openapi-generator": 4.0.1
  "@effect/platform-node": 4.0.1
  "@effect/platform-node-shared": 4.0.1
  "@effect/sql-pg": 4.0.1
  "@effect/sql-sqlite-do": 4.0.1
  "@effect/tsgo": 0.46.1
  "@effect/vitest": 4.0.1
  "@legendapp/list": 3.3.5
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@pierre/diffs": 1.3.0-beta.10
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  effect: 4.0.1
  jose: 6.2.2
  lightningcss: 1.33.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  undici: 8.11.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.1.0
  ws: 8.22.0
  yaml: ^2.9.0

# T3 Code Extensible's overrides, package extensions and patches at the pin, kept
# to the packages pnpm-lock.yaml installs and written by scripts/vendor.ts. The
# patches are vendored; client-runtime uses the RPC client hook the effect patch adds.
overrides:
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  # Keep one copy of these native-binary packages. lightningcss ships 11 platform binaries per
  # version, and the workspaces' tailwindcss ^4 ranges drift into two 4.3.x copies of the family.
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  "@tailwindcss/vite": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  lightningcss: "catalog:"
  tailwindcss: "catalog:"
  # Ranges from @effect/platform-node, jsdom, unifont, Expo and libsql otherwise
  # settle on two patch releases of each major. Older majors stay as they are.
  "undici@^8": "catalog:"
  "ws@^8": "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"
  yaml: "catalog:"

packageExtensions:
  # Our patch makes @effect/vitest import vite-plus/test. A catalog: spec here
  # resolves through the vite-plus override above.
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.1": vendor/t3code/patches/@effect__vitest@4.0.1.patch
  "@legendapp/list@3.3.5": vendor/t3code/patches/@legendapp__list@3.3.5.patch
  "@pierre/diffs@1.3.0-beta.10": vendor/t3code/patches/@pierre%2Fdiffs@1.3.0-beta.10.patch
  effect@4.0.1: vendor/t3code/patches/effect@4.0.1.patch

# vite is Vite+'s core at 1.0.0, which Vitest's peer ranges do not name.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
