packages:
  - extension
  - vendor/t3code/packages/*

allowBuilds:
  esbuild: true

# T3 Code Extensible's catalog at the pin, written by scripts/vendor.ts.
catalog:
  "@clerk/backend": 3.18.1
  "@clerk/clerk-js": 6.32.1
  "@clerk/electron": 0.0.44
  "@clerk/electron-passkeys": 0.0.3
  "@clerk/expo": 4.6.8
  "@clerk/react": 6.16.1
  "@clerk/shared": 4.33.0
  "@effect/atom-react": 4.0.1
  "@effect/openapi-generator": 4.0.1
  "@effect/platform-node": 4.0.1
  "@effect/platform-node-shared": 4.0.1
  "@effect/sql-pg": 4.0.1
  "@effect/sql-sqlite-do": 4.0.1
  "@effect/tsgo": 0.46.1
  "@effect/vitest": 4.0.1
  "@legendapp/list": 3.3.5
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@pierre/diffs": 1.3.0-beta.10
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  effect: 4.0.1
  jose: 6.2.2
  lightningcss: 1.33.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  undici: 8.11.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  ws: 8.22.0
  yaml: ^2.9.0

overrides:
  # One Effect, the patched one: the vendored packages and the extension share its runtime.
  effect: "catalog:"
  # The patched @effect/vitest runs on Vite+'s test runner instead of its own vitest.
  "@effect/vitest>vitest": "-"
  vite: "catalog:"
  vite-plus: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

# The fork's patches, vendored with the packages that rely on them (scripts/vendor.ts).
patchedDependencies:
  "@effect/vitest@4.0.1": vendor/t3code/patches/@effect__vitest@4.0.1.patch
  effect@4.0.1: vendor/t3code/patches/effect@4.0.1.patch

# vite is Vite+'s core at 1.0.0, which Vitest's peer ranges do not name.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
