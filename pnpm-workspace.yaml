packages:
  - extension
  - vendor/t3code/packages/*

allowBuilds:
  # The headless load's Chromium (pnpm test:web), into Playwright's per-user cache.
  "@playwright/browser-chromium": true
  # Marketplace signing; a local VSIX is not signed.
  "@vscode/vsce-sign": false
  esbuild: true
  # The fork's typescript, a native compiler whose install script fetches its binary.
  "@tsc-rs/typescript": true

# T3 Code Extensible's catalog at the pin, written by scripts/vendor.ts.
catalog:
  "@clerk/backend": 3.25.0
  "@clerk/clerk-js": 6.40.0
  "@clerk/electron": 0.1.3
  "@clerk/electron-passkeys": 0.0.3
  "@clerk/expo": 4.14.0
  "@clerk/react": 6.18.0
  "@clerk/shared": 4.41.0
  # Must match the version alchemy depends on: the relay overrides its
  # Cloudflare retry policy through this package's Retry service.
  "@distilled.cloud/cloudflare": 1.0.0-rc.13
  "@effect/atom-react": 4.0.5
  "@effect/graphql-generator": 4.0.5
  "@effect/openapi-generator": 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/platform-node-shared": 4.0.5
  "@effect/sql-pg": 4.0.5
  "@effect/sql-sqlite-do": 4.0.5
  "@effect/vitest": 4.0.5
  "@electron-webauthn/macos": 1.3.1
  "@legendapp/list": 3.3.5
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@pierre/diffs": 1.6.1
  "@pierre/highlights": 0.2.0
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  "@types/plist": 3.0.5
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@types/ws": 8.18.2
  effect: 4.0.5
  electron-webauthn: 1.3.1
  jose: 6.2.2
  lightningcss: 1.33.0
  objc-js: 1.5.0
  plist: 3.1.1
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  tldts: 7.4.2
  typescript: npm:@tsc-rs/typescript@0.8.0
  undici: 8.11.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  ws: 8.22.0
  yaml: ^2.9.0
  # Markdown pipeline: the server counts find matches with the same parser the
  # web renders with, so both must resolve to one version.
  mdast-util-directive: 3.1.0
  micromark-extension-directive: 4.0.0
  micromark-util-character: 2.1.1
  micromark-util-types: 2.0.2
  rehype-raw: 7.0.0
  rehype-sanitize: 6.0.0
  remark-breaks: 4.0.0
  remark-gfm: 4.0.1
  remark-parse: 11.0.0
  remark-rehype: 11.1.2
  unified: 11.0.5

# T3 Code Extensible's overrides, package extensions and patches at the pin, kept
# to the packages pnpm-lock.yaml installs and written by scripts/vendor.ts. The
# patches are vendored; client-runtime uses the RPC client hook the effect patch adds.
overrides:
  mdast-util-math: 3.0.0
  micromark-extension-llm-math: 3.1.0
  "@legendapp/list": 3.3.5
  "@pierre/diffs": 1.6.1
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  # Resolve below remark-math so Vite, Metro and Node use the same tokenizer.
  "remark-math>micromark-extension-math": npm:micromark-extension-llm-math@3.1.0
  micromark-extension-gfm-table: 2.1.1
  # Keep one copy of these native-binary packages. lightningcss ships 11 platform binaries per
  # version, and the workspaces' tailwindcss ^4 ranges drift into two 4.3.x copies of the family.
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  "@tailwindcss/vite": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  lightningcss: "catalog:"
  tailwindcss: "catalog:"
  # Ranges from @effect/platform-node, jsdom, unifont, Expo and libsql otherwise
  # settle on two patch releases of each major. Older majors stay as they are.
  "@types/ws@^8": "catalog:"
  "undici@^8": "catalog:"
  "ws@^8": "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"
  yaml: "catalog:"

packageExtensions:
  # Our patch makes @effect/vitest import vite-plus/test. A catalog: spec here
  # resolves through the vite-plus override above.
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  mdast-util-math@3.0.0: vendor/t3code/patches/mdast-util-math@3.0.0.patch
  micromark-extension-llm-math@3.1.0: vendor/t3code/patches/micromark-extension-llm-math@3.1.0.patch
  micromark-extension-gfm-table@2.1.1: vendor/t3code/patches/micromark-extension-gfm-table@2.1.1.patch
  "@effect/vitest@4.0.5": vendor/t3code/patches/@effect__vitest@4.0.5.patch
  "@legendapp/list@3.3.5": vendor/t3code/patches/@legendapp__list@3.3.5.patch
  # Exports the dependency-light subpaths mobile and the web diff parser import, and keeps
  # measured wrapped-row heights above an edit (fileEditorVirtualization.test.ts).
  "@pierre/diffs@1.6.1": vendor/t3code/patches/@pierre%2Fdiffs@1.6.1.patch

# vite is Vite+'s core, whose versions Vitest's peer ranges do not name.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
